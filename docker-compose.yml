services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
    ports:
      # Bind to loopback only: TLS terminates at the reverse proxy on this
      # host, so the app must not be reachable directly over plain HTTP.
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - lector-data:/data

volumes:
  lector-data:
